services:
  keycloakdb:
    image: postgres:15-alpine
    container_name: sot-prod-auth-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-auth-keycloak-postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: sot-prod-auth-keycloak
    depends_on:
      - keycloakdb
    environment:
      # Database connection settings
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Admin credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Keycloak settings
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTP_PORT: 8080
      KC_PROXY: edge
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: INFO
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-auth-keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    command: start-dev
    restart: unless-stopped
