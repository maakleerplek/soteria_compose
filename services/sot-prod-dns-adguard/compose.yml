services:
  sot-prod-dns-adguard:
    image: adguard/adguardhome
    container_name: sot-prod-dns-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "5350:80/tcp"
      - "5443:443/tcp"
      - "853:853/tcp"
      - "784:784/udp"
      - "3082:3000/tcp"
    volumes:
      - /var/lib/docker-compose/sot-prod-dns-adguard/work:/opt/adguardhome/work
      - /var/lib/docker-compose/sot-prod-dns-adguard/conf:/opt/adguardhome/conf
