services:
  authentik-db:
    image: postgres:16-alpine
    container_name: sot-prod-auth-authentik-db
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB}
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-auth-authentik-postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2.2
    container_name: sot-prod-auth-authentik-server
    command: server
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_USE_TLS}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM}
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-auth-authentik_media:/media
      - /docker_data/sot-prod-auth-authentik_templates:/templates
    ports:
      - "9080:9000"
      - "9444:9443"
    shm_size: 512mb
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2.2
    container_name: sot-prod-auth-authentik-worker
    command: worker
    user: root
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_USE_TLS}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM}
      TZ: 'Europe/Brussels'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker_data/sot-prod-auth-authentik_media:/media
      - /docker_data/sot-prod-auth-authentik_certs:/certs
      - /docker_data/sot-prod-auth-authentik_templates:/templates
    shm_size: 512mb
    restart: unless-stopped
