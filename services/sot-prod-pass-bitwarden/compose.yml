services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: sot-prod-pass-bitwarden
    restart: unless-stopped
    depends_on:
      - keycloak
    environment:
      # Domain for reverse proxy (set to your actual domain)
      DOMAIN: ${BITWARDEN_DOMAIN}

      # Security: Disable signups after creating admin account
      SIGNUPS_ALLOWED: ${BITWARDEN_SIGNUPS_ALLOWED:-false}

      # Admin panel access (generate token with: echo -n "your-password" | argon2 "$(openssl rand -base64 32)" -e -id -k 65540 -t 3 -p 4)
      ADMIN_TOKEN: ${BITWARDEN_ADMIN_TOKEN}

      # SSO via Keycloak OIDC
      SSO_ENABLED: ${BITWARDEN_SSO_ENABLED:-true}
      SSO_ONLY: ${BITWARDEN_SSO_ONLY:-false}
      SSO_AUTHORITY: ${BITWARDEN_SSO_AUTHORITY}
      SSO_CLIENT_ID: ${BITWARDEN_SSO_CLIENT_ID:-vaultwarden}
      SSO_CLIENT_SECRET: ${BITWARDEN_SSO_CLIENT_SECRET}
      SSO_SCOPES: ${BITWARDEN_SSO_SCOPES:-profile email offline_access}
      SSO_PKCE: ${BITWARDEN_SSO_PKCE:-true}
      SSO_CALLBACK_PATH: ${BITWARDEN_SSO_CALLBACK_PATH:-/identity/connect/oidc-signin}

      # SSO Role mapping (optional)
      SSO_ROLES_ENABLED: ${BITWARDEN_SSO_ROLES_ENABLED:-false}
      SSO_ROLES_DEFAULT_TO_USER: ${BITWARDEN_SSO_ROLES_DEFAULT_TO_USER:-true}

      # Additional security settings
      INVITATIONS_ALLOWED: ${BITWARDEN_INVITATIONS_ALLOWED:-false}
      SHOW_PASSWORD_HINT: ${BITWARDEN_SHOW_PASSWORD_HINT:-false}

      # Timezone
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-pass-bitwarden:/data
    ports:
      - "8082:80"
