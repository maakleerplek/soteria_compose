services:
  wikidb:
    image: postgres:15-alpine
    container_name: sot-prod-wiki-wikijs-db
    environment:
      POSTGRES_DB: ${WIKI_POSTGRES_DB}
      POSTGRES_PASSWORD: ${WIKI_POSTGRES_PASSWORD}
      POSTGRES_USER: ${WIKI_POSTGRES_USER}
      TZ: 'Europe/Brussels'
    volumes:
      - /docker_data/sot-prod-wiki-wikijs-wikidb_data:/var/lib/postgresql/data
    restart: unless-stopped

  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: sot-prod-wiki-wikijs
    depends_on:
      - wikidb
    environment:
      DB_TYPE: postgres
      DB_HOST: wikidb
      DB_PORT: 5432
      DB_USER: ${WIKI_POSTGRES_USER}
      DB_PASS: ${WIKI_POSTGRES_PASSWORD}
      DB_NAME: ${WIKI_POSTGRES_DB}
      TZ: 'Europe/Brussels'
    restart: unless-stopped
    ports:
      - "3081:3000"
    volumes:
      - /docker_data/sot-prod-wiki-wikijs-wiki_data_content:/wiki/data/content
